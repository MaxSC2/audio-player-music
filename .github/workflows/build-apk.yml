name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Create Flutter project
        run: |
          rm -rf app_temp lib_backup
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          mkdir -p mainactivity_backup
          cp -r android/app/src/main/kotlin mainactivity_backup/
          cp android/app/src/main/AndroidManifest.xml mainactivity_backup/AndroidManifest.xml
          [ -d android/app/src/main/res/layout ] && cp -r android/app/src/main/res/layout mainactivity_backup/
          [ -d android/app/src/main/res/xml ] && cp -r android/app/src/main/res/xml mainactivity_backup/
          [ -d android/app/src/main/res/drawable ] && cp -r android/app/src/main/res/drawable mainactivity_backup/
          [ -d android/app/src/main/res/raw ] && cp -r android/app/src/main/res/raw mainactivity_backup/
          [ -f android/app/src/main/res/drawable/widget_bg.xml ] && cp android/app/src/main/res/drawable/widget_bg.xml mainactivity_backup/
          [ -d android/app/src/main/res/drawable-nodpi ] && cp -r android/app/src/main/res/drawable-nodpi mainactivity_backup/
          [ -f android/app/src/main/res/values/strings.xml ] && cp android/app/src/main/res/values/strings.xml mainactivity_backup/
          [ -f android/app/src/main/res/values/colors.xml ] && cp android/app/src/main/res/values/colors.xml mainactivity_backup/
          mkdir -p mainactivity_backup && for d in android/app/src/main/res/mipmap-*; do [ -d "$d" ] && cp -r "$d" mainactivity_backup/; done
          flutter create --org com.example --project-name audio_player app_temp
          cp -r app_temp/. .
          rm -rf lib
          cp -r lib_backup lib
          cp pubspec_backup.yaml pubspec.yaml
          cp -r mainactivity_backup/kotlin android/app/src/main/
          # Манифест возвращаем на репозиторный: flutter create кладёт свой,
          # без AudioService и foreground-разрешений (см. шаг Verify ниже).
          cp mainactivity_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          [ -d mainactivity_backup/layout ] && cp -r mainactivity_backup/layout android/app/src/main/res/
          [ -d mainactivity_backup/xml ] && cp -r mainactivity_backup/xml android/app/src/main/res/
          [ -d mainactivity_backup/drawable ] && cp -r mainactivity_backup/drawable android/app/src/main/res/
          [ -d mainactivity_backup/raw ] && cp -r mainactivity_backup/raw android/app/src/main/res/
          [ -f mainactivity_backup/widget_bg.xml ] && cp mainactivity_backup/widget_bg.xml android/app/src/main/res/drawable/
          [ -d mainactivity_backup/drawable-nodpi ] && cp -r mainactivity_backup/drawable-nodpi android/app/src/main/res/
          [ -f mainactivity_backup/strings.xml ] && cp mainactivity_backup/strings.xml android/app/src/main/res/values/
          [ -f mainactivity_backup/colors.xml ] && cp mainactivity_backup/colors.xml android/app/src/main/res/values/
          for d in mainactivity_backup/mipmap-*; do [ -d "$d" ] && cp -r "$d" android/app/src/main/res/; done
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          rm -rf app_temp lib_backup pubspec_backup.yaml mainactivity_backup

      - name: Setup signing
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore
          cat > android/app/key.properties << 'EOF'
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          cp android/app/build.gradle.kts.tmpl android/app/build.gradle.kts

      - name: Verify AndroidManifest
        run: |
          # ФИКС: манифест больше НЕ перезаписывается этим workflow — источник
          # истины в репозитории (android/app/src/main/AndroidManifest.xml).
          # Иначе dev- и CI-сборки расходились: локальная сборка выходила без
          # foreground-сервиса и POST_NOTIFICATIONS.
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'com.ryanheise.audioservice.AudioService' "$M"
          grep -q 'foregroundServiceType="mediaPlayback"' "$M"
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$M"
          grep -q 'POST_NOTIFICATIONS' "$M"
          echo "AndroidManifest OK: AudioService + foreground-разрешения на месте"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk