name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0

      - name: Create Flutter project
        run: |
          rm -rf app_temp lib_backup
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          mkdir -p mainactivity_backup
          cp -r android/app/src/main/kotlin mainactivity_backup/
          [ -d android/app/src/main/res/layout ] && cp -r android/app/src/main/res/layout mainactivity_backup/
          [ -d android/app/src/main/res/xml ] && cp -r android/app/src/main/res/xml mainactivity_backup/
          [ -f android/app/src/main/res/drawable/widget_bg.xml ] && cp android/app/src/main/res/drawable/widget_bg.xml mainactivity_backup/
          [ -d android/app/src/main/res/drawable-nodpi ] && cp -r android/app/src/main/res/drawable-nodpi mainactivity_backup/
          [ -f android/app/src/main/res/values/strings.xml ] && cp android/app/src/main/res/values/strings.xml mainactivity_backup/
          flutter create --org com.example --project-name audio_player app_temp
          cp -r app_temp/. .
          rm -rf lib
          cp -r lib_backup lib
          cp pubspec_backup.yaml pubspec.yaml
          cp -r mainactivity_backup/kotlin android/app/src/main/
          [ -d mainactivity_backup/layout ] && cp -r mainactivity_backup/layout android/app/src/main/res/
          [ -d mainactivity_backup/xml ] && cp -r mainactivity_backup/xml android/app/src/main/res/
          [ -f mainactivity_backup/widget_bg.xml ] && cp mainactivity_backup/widget_bg.xml android/app/src/main/res/drawable/
          [ -d mainactivity_backup/drawable-nodpi ] && cp -r mainactivity_backup/drawable-nodpi android/app/src/main/res/
          [ -f mainactivity_backup/strings.xml ] && cp mainactivity_backup/strings.xml android/app/src/main/res/values/
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          rm -rf app_temp lib_backup pubspec_backup.yaml mainactivity_backup

      - name: Setup signing
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore
          cat > android/app/key.properties << 'EOF'
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          cp android/app/build.gradle.kts.tmpl android/app/build.gradle.kts

      - name: Update AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOFMANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="NeonWave"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
                  <receiver
                      android:name=".widget.WidgetActionReceiver"
                      android:exported="false"/>
                  <receiver
                      android:name=".widget.SmallWidgetProvider"
                      android:exported="true"
                      android:label="NeonWave — компактный">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/small_widget_info"/>
                  </receiver>
                  <receiver
                      android:name=".widget.LargeWidgetProvider"
                      android:exported="true"
                      android:label="NeonWave — расширенный">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/large_widget_info"/>
                  </receiver>
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService"/>
                      </intent-filter>
                  </service>
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOFMANIFEST

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk